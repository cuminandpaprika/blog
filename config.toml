baseURL = "https://www.jackzheng.co/"
publishDir = "docs"
locale = "en"                                            # website language
defaultContentLanguage = "en"                            # [en, zh, ...] determines which i18n file to use
title = "Jack Zheng"                                   # website title
theme = "LoveIt"                                         # theme
enableGitInfo = true                                    # whether to use git commit log to generate lastmod record
hasCJKLanguage = false                                   # whether to include chinese/japanese/korean
paginate = 12                                            # default amount of posts in each pages
enableEmoji = true                                       # whether to use emoji code
enableRobotsTXT = true                                   # whether to use robots.txt
googleAnalytics = "G-RQNN5TQ173"                                     # [UA-XXXXXXXX-X] google analytics code
disqusShortname = ""                             # Disqus shortname to use Disqus in posts
copyright = "This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License."
                                                         # copyright description used only for seo schema

                                                      #### Syntax Highlighting (https://gohugo.io/content-management/syntax-highlighting)
pygmentsOptions = "linenos=table"
pygmentsCodefences = true
pygmentsUseClasses = true
pygmentsCodefencesGuessSyntax = true

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[author]                                              #### Author Info
  name = "Jack Zheng"

[sitemap]                                             #### Sitemap Info
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[Permalinks]                                          #### Permalinks Info (https://gohugo.io/content-management/urls/#permalinks)
  posts = ":contentbasename"

[menu]                                                #### Menu Info
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "posts"
    weight = 1

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "tags"
    weight = 2

  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "categories"
    weight = 3

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "about"
    weight = 4

[params]
  defaultTheme = "auto"                                   # site default theme ["auto", "light", "dark"]
  description = "Jack Zheng is a Staff Engineer building real-time fraud and fintech systems in Go, GCP and AWS — with a growing focus on systems thinking and agentic engineering."
  images = ["/cover.png"]                                 # site image for Open Graph / Twitter Cards (was unset before - no link previews had an image)
  gitRepo = "https://github.com/cuminandpaprika/blog"

  [params.author]
    name = "Jack Zheng"
    email = ""
    link = ""

  [params.header]
    [params.header.title]
      name = "Jack Zheng"
      logo = "/images/logo-mark.svg"

  [params.footer]                                        #### Footer Info
    since = 2020
    icp = ''
    license = '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

  [params.home]
    [params.home.profile]
      title = "STAFF ENGINEER · REAL-TIME FRAUD & FINTECH 🚀"
      subtitle = "Real-time fraud and fintech systems in Go — with a growing focus on systems thinking and agentic engineering."
    [params.home.posts]
      paginate = 6

  [params.app]
    title = "Jack Zheng"

  [params.seo]                                           # site-wide SEO image (JSON-LD)
    image = "/cover.png"

  [params.verification]
    google = ""
    bing = ""
    yandex = ""
    pinterest = ""
    baidu = ""

  [params.page]
    linkToMarkdown = true
    [params.page.share]                                  # Social Share Links in post page
      enable = false
      X = true
      Facebook = true
      Reddit = true
    [params.page.seo]
      [params.page.seo.publisher]
        name = "Jack Zheng"
        logoUrl = "/logo.png"
    [params.page.comment]
      [params.page.comment.gitalk]                       # Gitalk Comment Config (https://github.com/gitalk/gitalk)
        owner = ""
        repo = ""
        clientId = ""
        clientSecret = ""
      [params.page.comment.valine]                       # Valine Comment Config (https://github.com/xCss/Valine)
        enable = false
        appId = ""
        appKey = ""
        avatar = "mp"
        placeholder = "Your comment ..."
        visitor = true
        recordIP = true
      [params.page.comment.facebook]                     # Facebook Comment Config (https://developers.facebook.com/docs/plugins/comments)
        enable = false
        width = "100%"
        numPosts = 10
        appId = ""
        languageCode = "en_US"

  [params.cdn]                                       #### CSS and JS Files CDN
    fontawesome_free_css = ''                           # for example '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.10.1/css/all.min.css" integrity="sha256-fdcFNFiBMrNfWL6OcAGQz6jDgNTRxnrLEd4vJYFWScE=" crossorigin="anonymous">'
